---
modules:
  - type: dnf
    install:
      skip-unavailable: true
      install-weak-deps: false
      packages:
        - sway
        - sway-config-upstream
        - sway-systemd
        - xdg-desktop-portal-wlr
        - xdg-desktop-portal-gtk
  - type: os-release
    properties:
      ID: guacho
      NAME: Guacho
      ID_LIKE: fedora
      PRETTY_NAME: Guacho Sway
